kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: gitops-demo-cluster

nodes:
  - role: control-plane
    image: kindest/node:v1.36.1

    # http
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP

      # https
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  # - role: control-plane
  # - role: worker
  # - role: worker
