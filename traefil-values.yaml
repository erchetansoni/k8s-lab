# ============================================================
# Traefik Gateway API
# KIND / Docker Desktop
# ============================================================

deployment:
  enabled: true
  kind: DaemonSet

# ============================================================
# SECURITY
# ============================================================

hostNetwork: false

# ============================================================
# HTTP / HTTPS
# ============================================================

ports:
  web:
    port: 80
    containerPort: 80
    hostPort: 80
    exposedPort: 80
    protocol: TCP

  websecure:
    port: 443
    containerPort: 443
    hostPort: 443
    exposedPort: 443
    protocol: TCP

    http:
      tls:
        enabled: true

# ============================================================
# GATEWAY API
# ============================================================

providers:
  kubernetesGateway:
    enabled: true

  # ============================================================
  # Disable older routing APIs
  # ============================================================

  kubernetesCRD:
    enabled: false

  kubernetesIngress:
    enabled: false

# ============================================================
# We create GatewayClass/Gateway ourselves
# ============================================================

gateway:
  enabled: false

gatewayClass:
  enabled: false

# ============================================================
# Traditional Ingress disabled
# ============================================================

ingressClass:
  enabled: false

# ============================================================
# SECURITY CONTEXT
# ============================================================

securityContext:
  capabilities:
    drop:
      - ALL

    add:
      - NET_BIND_SERVICE

  allowPrivilegeEscalation: false

  readOnlyRootFilesystem: true

  runAsNonRoot: true

# ============================================================
# LOGGING
# ============================================================

log:
  level: INFO

accessLog:
  enabled: true
